name: My Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-v1

      - name: Placeholder google-services.json
        run: |
          echo '' | base64 -d > app/google-services.json

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --stacktrace

      - name: Trim APKs (keep arm64 only)
        run: |
          D=app/build/outputs/apk/github/debug
          ls -l "$D"
          mkdir -p /tmp/apk
          F=$(ls "$D"/*arm64-v8a*.apk 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            cp "$F" /tmp/apk/
            echo "kept: $F"
          else
            echo "no arm64 apk found, keep all"
            cp "$D"/*.apk /tmp/apk/
          fi
          ls -lh /tmp/apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-debug-apk
          path: /tmp/apk/*.apk
          if-no-files-found: error
